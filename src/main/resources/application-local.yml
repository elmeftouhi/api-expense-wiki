spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/expense-db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins:
      - http://localhost:5173
  jwt:
    secret: replace-with-at-least-32-characters-local-secret-key
    expiration-minutes: 120

logging:
  level:
    com.elmeftouhi.expense: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: DEBUG

